<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base href="/"><title>README preview</title>
<style>
body{margin:0;background:#0d1117;color:#f0f6fc;font:14px -apple-system,"Segoe UI",sans-serif}
.box{max-width:880px;margin:40px auto;border:1px solid #3d444d;border-radius:6px}
.head{padding:10px 16px;border-bottom:1px solid #3d444d;font-weight:600}
.md{padding:24px}.md p{margin:0 0 16px}.md img{max-width:100%}
details{color:#9198a1}
</style></head><body>
<div class="box"><div class="head">README</div><div class="md" id="md"></div></div>
<script>fetch('/README.md?'+Date.now()).then(r=>r.text()).then(t=>{document.getElementById('md').innerHTML=t.replace(/<summary><sub>([^<]*)<\/sub><\/summary>[\s\S]*<\/details>/,'<summary>$1</summary></details>')})</script>
</body></html>
